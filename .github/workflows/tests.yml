name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: bash -n install_local.sh examples/standalone/*.sh
      - run: ./examples/standalone/run_sample_demo.sh

